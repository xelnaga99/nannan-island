<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>楠楠島 - 楠梓高中 3D 校園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading" role="status" aria-live="polite">
  <div class="ld-boat">⛵</div>
  <div class="ld-logo">NANNAN<br>ISLAND.</div>
  <div class="ld-sub">登島中<i>.</i><i>.</i><i>.</i></div>
  <div class="ld-bar"><b id="ldBar"></b></div>
  <div class="ld-step" id="ldStep">準備出發</div>
  <div class="ld-tip" id="ldTip"></div>
</div>
<script>
(function(){
  var tips=["點一下島上的建築，可以看班級介紹","右上角可以選角色，跟著他過一天","音樂可以在右上角關閉","手機可以用單指轉動、雙指縮放","白天和夜晚的校園風景不一樣喔"];
  var t=document.getElementById("ldTip"); if(t) t.textContent="小提示："+tips[Math.floor(Math.random()*tips.length)];
  window.__ld=function(p,txt){var b=document.getElementById("ldBar"),s=document.getElementById("ldStep"); if(b) b.style.width=p+"%"; if(s&&txt) s.textContent=txt;};
  window.__ldDone=function(){var e=document.getElementById("loading"); if(!e) return; window.__ld(100,"登島完成"); setTimeout(function(){e.classList.add("done"); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },900);},250);};
  window.addEventListener("error",function(e){ if(document.getElementById("loading")&&window.__ld) window.__ld(40,"載入發生問題，請重新整理（"+(e&&e.message?String(e.message).slice(0,40):"")+"）"); });
  window.__ldTimer=setTimeout(function(){ if(typeof THREE==="undefined") window.__ld(40,"連線比較慢，請檢查網路後重新整理"); },15000);
})();
</script>

<canvas id="stage" aria-label="楠梓高中 3D 校園地圖"></canvas>
<div id="labels"></div>

<div class="topbar">
<header class="brand">
  <div class="bx">NANNAN<br>ISLAND.</div>
  <div class="bt"><b>一起來當島民吧</b><span><em>NTHS</em> 楠楠島 · 楠梓高中</span><i class="on-pill" id="on-pill" hidden>● 島上 <b id="on-n">1</b> 位島民</i></div>
</header>

<nav class="toolbar">
  <button id="btn-overview" type="button">全景</button>
  <button id="btn-missions" type="button">🎯 任務</button>
  <button id="btn-role" type="button">選擇角色</button>
  <button id="btn-list" type="button">☰ 特色專班/科別</button>
  <button id="btn-gate" type="button">大門校門</button>
  <button id="btn-walkway" type="button">中庭走道</button>
  <button id="btn-pavilion" type="button">花園涼亭</button>
  <button id="btn-library" type="button">圖資鐘塔</button>
  <button id="btn-theater" type="button">戶外劇場</button>
  <button id="btn-sports" type="button">光電球場</button>
  <button id="btn-forest" type="button">黑森林</button>
  <button id="btn-track" type="button">北端操場</button>
</nav>
</div>

<aside id="list" class="list" hidden aria-label="專班科別清單"></aside>

<section id="panel" class="panel" hidden aria-live="polite">
  <button id="panel-close" class="panel-close" type="button" aria-label="關閉並返回全景">✕</button>
  <p id="panel-tag" class="panel-tag"></p>
  <h2 id="panel-title"></h2>
  <p id="panel-intro" class="panel-intro"></p>
  <div id="panel-game" class="panel-game"></div>
  <ul id="panel-items" class="items"></ul>
</section>

<div class="timebar" id="timebar">
  <button id="t-play" type="button" aria-label="暫停或播放時間">⏸</button>
  <span class="t-clock" id="t-clock">12:00</span>
  <input id="t-range" type="range" min="0" max="24" step="0.01" value="12" aria-label="一天中的時間">
  <span class="t-label" id="t-label">白天</span>
  <button id="t-speed" type="button" title="時間流速">4×</button>
  <button id="t-now" type="button" title="回到現在時間">現在</button>
  <button id="t-music" type="button" title="背景音樂開／關">♪ 音樂：開</button>
</div>

<div class="vignette"></div>
<div class="rolepick" id="rolepick" hidden>
  <div class="rp-card">
    <h2>選擇你的角色</h2>
    <p class="rp-note" id="rp-note"></p>
    <div class="rp-grid" id="rp-grid"></div>
    <div class="rp-opts" id="rp-opts"></div>
    <div class="rp-act">
      <button id="rp-go" class="go" type="button" disabled>開始逛校園</button>
      <button id="rp-skip" type="button" hidden>跳到早上 7:30</button>
      <button id="rp-close" type="button">取消</button>
    </div>
  </div>
</div>

<div class="rolehud" id="rolehud" hidden>
  <span class="rh-dot" id="rh-dot"></span><b id="rh-name"></b>
  <span id="rh-goal"></span><span class="rh-arrow" id="rh-arrow">➤</span>
  <button id="rh-near" class="near" type="button" hidden></button>
  <button id="rh-auto" type="button">自己操控</button>
  <button id="rh-view" type="button">第一人稱</button>
  <button id="rh-exit" type="button">結束角色</button>
</div>
<div class="rolekeys" id="rolekeys" hidden>W A S D／方向鍵移動 · Shift 跑步 · 拖曳畫面轉動視角</div>
<div class="joy" id="joy" hidden><div class="knob" id="joy-knob"></div></div>
<div class="social" id="social" hidden></div>
<div class="rps" id="rps" hidden><div class="rps-card" id="rps-card"></div></div>
<div class="toast" id="toast"></div>

<p class="hint">點擊任一專班或標籤查看介紹 · 按住左鍵旋轉 · 滾輪縮放</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>window.__ld&&__ld(35,"載入 3D 引擎");</script>
<script>window.__ld&&__ld(60,"搭建校園");</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
